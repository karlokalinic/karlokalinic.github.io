name: KARLOLEGEND Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - "karlolegend-desktop/release.json"
      - ".github/workflows/karlolegend-desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karlolegend-desktop-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate explicit release request
        shell: pwsh
        run: |
          [xml]$project = Get-Content "karlolegend-desktop/source/KarloDiskShell.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "Version is missing from KarloDiskShell.csproj"
          }

          if (!(Test-Path "karlolegend-desktop/release.json")) {
            throw "karlolegend-desktop/release.json is missing"
          }

          $release = Get-Content "karlolegend-desktop/release.json" -Raw | ConvertFrom-Json
          $requestedVersion = [string]$release.Version
          $channel = [string]$release.Channel

          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            throw "release.json Version is missing"
          }

          if ($requestedVersion -ne $projectVersion) {
            throw "release.json requests $requestedVersion but project version is $projectVersion"
          }

          if ($channel -ne "stable") {
            throw "Only the stable channel is currently supported"
          }

          "VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Refuse accidental release overwrite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump the application version; published releases are immutable by policy."
          }

      - name: Publish self-contained Windows EXE
        shell: pwsh
        run: |
          $publish = "karlolegend-desktop/build/publish"
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }

          dotnet publish "karlolegend-desktop/source/KarloDiskShell.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publish

          $exe = "$publish/KARLOLEGEND.exe"
          if (!(Test-Path $exe)) {
            throw "Publish completed without KARLOLEGEND.exe"
          }

          # K: has a deliberate one-visible-EXE deployment contract. If a new
          # dependency starts producing loose runtime files, stop the release
          # rather than publish an update that silently breaks deployment.
          $publishedFiles = @(Get-ChildItem $publish -File -Recurse)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -ne "KARLOLEGEND.exe") {
            $publishedFiles | ForEach-Object { Write-Host "Published: $($_.FullName)" }
            throw "Single-file deployment contract broken: publish output must contain only KARLOLEGEND.exe"
          }

      - name: Build update package
        shell: pwsh
        run: |
          $exe = Resolve-Path "karlolegend-desktop/build/publish/KARLOLEGEND.exe"
          $packageRoot = "karlolegend-desktop/build/package"
          $zip = "karlolegend-desktop/build/KARLOLEGEND-v$env:VERSION.zip"
          $update = "karlolegend-desktop/build/KARLOLEGEND-v$env:VERSION.karloupdate"
          $notes = "karlolegend-desktop/build/RELEASE-NOTES.md"

          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item $exe "$packageRoot/KARLOLEGEND.exe" -Force

          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash

          # Exact PascalCase remains part of the backward-compatible package API.
          $manifest = [ordered]@{
            Schema = 1
            Version = $env:VERSION
            File = "KARLOLEGEND.exe"
            Sha256 = $sha256
            Notes = "KARLOLEGEND Desktop v$env:VERSION. See CHANGELOG.md in source for details."
          }

          $manifest |
            ConvertTo-Json -Depth 4 |
            Set-Content "$packageRoot/manifest.json" -Encoding UTF8

          @"
          # KARLOLEGEND Desktop v$env:VERSION

          Stable Windows x64 self-contained build.

          The .karloupdate asset is consumed directly by KARLOLEGEND Desktop.
          Its embedded manifest contains the SHA-256 of the replacement executable.
          "@ | Set-Content $notes -Encoding UTF8

          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $update) { Remove-Item $update -Force }

          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -CompressionLevel Optimal
          Move-Item $zip $update -Force

          "UPDATE_ASSET=$update" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_ASSET=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NOTES_FILE=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"

          gh release create $tag `
            "$env:UPDATE_ASSET" `
            "$env:EXE_ASSET" `
            --title "KARLOLEGEND Desktop v$env:VERSION" `
            --notes-file "$env:NOTES_FILE" `
            --target "${{ github.sha }}"
