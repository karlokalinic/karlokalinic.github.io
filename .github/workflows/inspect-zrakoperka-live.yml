name: Fetch current ZRAKOPERKA trailer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-zrakoperka-live.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact live trailer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 5 --retry-delay 2 -A 'Mozilla/5.0' 'https://zrakoperka.karlolegend.workers.dev/media/zrakoperka-trailer.mp4' -o out/zrakoperka-trailer.mp4
          test "$(stat -c%s out/zrakoperka-trailer.mp4)" -eq 20329757
          sha256sum out/zrakoperka-trailer.mp4 > out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zrakoperka-live-trailer
          path: out/
          compression-level: 0
