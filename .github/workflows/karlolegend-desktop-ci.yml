name: KARLOLEGEND Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "karlolegend-desktop/source/**"
      - "karlolegend-desktop/install.ps1"
      - "karlolegend-desktop/README.md"
      - "karlolegend-desktop/AI_CONTEXT.md"
      - "karlolegend-desktop/AGENTS.md"
      - ".github/instructions/karlolegend-desktop.instructions.md"
      - ".github/workflows/karlolegend-desktop-ci.yml"
  pull_request:
    paths:
      - "karlolegend-desktop/source/**"
      - "karlolegend-desktop/install.ps1"
      - "karlolegend-desktop/README.md"
      - "karlolegend-desktop/AI_CONTEXT.md"
      - "karlolegend-desktop/AGENTS.md"
      - ".github/instructions/karlolegend-desktop.instructions.md"
      - ".github/workflows/karlolegend-desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: karlolegend-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bootstrap with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "karlolegend-desktop/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "karlolegend-desktop/install.ps1 contains Windows PowerShell syntax errors"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "karlolegend-desktop/source/KarloDiskShell.csproj"

      - name: Build
        shell: pwsh
        run: |
          dotnet build "karlolegend-desktop/source/KarloDiskShell.csproj" -c Release --no-restore
          $exit = $LASTEXITCODE

          if ($exit -ne 0) {
            Write-Host "--- WPF generated-source diagnostics ---"
            $generated = Get-ChildItem "karlolegend-desktop/source/obj" -Recurse -Filter "MainWindow.g.cs" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($generated) {
              Write-Host "Generated file: $($generated.FullName)"
              $lines = Get-Content $generated.FullName
              for ($i = 280; $i -lt [Math]::Min($lines.Count, 380); $i++) {
                Write-Host (("{0,4}: " -f ($i + 1)) + $lines[$i])
              }
            }
            exit $exit
          }

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          $publish = "karlolegend-desktop/build/ci-publish"
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }

          dotnet publish "karlolegend-desktop/source/KarloDiskShell.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o $publish

          $exe = "$publish/KARLOLEGEND.exe"
          if (!(Test-Path $exe)) {
            throw "Publish completed without KARLOLEGEND.exe"
          }

          $publishedFiles = @(Get-ChildItem $publish -File -Recurse)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -ne "KARLOLEGEND.exe") {
            $publishedFiles | ForEach-Object { Write-Host "Published: $($_.FullName)" }
            throw "Single-file deployment contract broken: publish output must contain only KARLOLEGEND.exe"
          }

      - name: Runtime smoke test published EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "karlolegend-desktop/build/ci-publish/KARLOLEGEND.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "karlolegend-runtime-smoke"
          if (Test-Path $smokeRoot) { Remove-Item $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          $arguments = @("--smoke-test", "--root", "`"$smokeRoot`"")
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -Wait

          if ($process.ExitCode -ne 0) {
            $log = Join-Path $smokeRoot ".karlo/logs/startup.log"
            if (Test-Path $log) {
              Write-Host "--- KARLOLEGEND startup log ---"
              Get-Content $log | Write-Host
            }
            throw "Published KARLOLEGEND.exe failed runtime smoke test with exit code $($process.ExitCode)"
          }

          if (!(Test-Path (Join-Path $smokeRoot ".karlo"))) {
            throw "Runtime smoke test exited successfully but did not initialize KARLOLEGEND state"
          }
