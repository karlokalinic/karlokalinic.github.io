name: Balkan Survival integrity

on:
  push:
    branches: [main]
    paths:
      - 'balkan-survival/**'
      - '.github/workflows/balkan-survival-validate.yml'
  pull_request:
    paths:
      - 'balkan-survival/**'
      - '.github/workflows/balkan-survival-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate archive and MAIN pointer
        run: node balkan-survival/scripts/validate.mjs

      - name: Validate Unity Web project contract
        run: node balkan-survival/scripts/validate-webgl-project.mjs

      - name: Prove immutable release packaging
        run: node balkan-survival/scripts/test-release-packager.mjs

      - name: Syntax-check cloud release shell hooks
        shell: bash
        run: |
          set -euo pipefail
          bash -n balkan-survival/webgl/cloud/uba-post-build.sh
          bash -n balkan-survival/webgl/cloud/promote-vercel.sh

      - name: Syntax-check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find balkan-survival/builds balkan-survival/assets balkan-survival/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 2>/dev/null || true)

      - name: Require a devlog entry for project changes
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE"; fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="HEAD^"; fi

          CHANGED=$(git diff --name-only "$BASE" HEAD -- balkan-survival || true)
          NONLOG=$(printf '%s\n' "$CHANGED" | grep -v '^balkan-survival/devlog/' | grep -v '^$' || true)
          DEVLOG=$(printf '%s\n' "$CHANGED" | grep '^balkan-survival/devlog/.*\.md$' || true)

          if [ -n "$NONLOG" ] && [ -z "$DEVLOG" ]; then
            echo 'Project changed without a new devlog entry.'
            exit 1
          fi
