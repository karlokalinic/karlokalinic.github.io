name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate KL Atlas browser JavaScript
        run: |
          node --check kl-atlas/03-playground-zero.js
          node --check kl-atlas/04-personal-workspace.js
          node --check kl-atlas/05-goal-engine.js
          node --check kl-atlas/05-projects.js
          node --check kl-atlas/10-parse.js
          node --check kl-atlas/15-curriculum.js
          node --check kl-atlas/17-pauktunel-depth.js
          node --check kl-atlas/20-render.js
          node --check kl-atlas/30-pedagogy.js
          node --check kl-atlas/40-app.js
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
